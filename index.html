<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>そろばん学習アプリ</title>
<style>
  :root {
    --bg-main: #ffffff;
    --frame-wood: #784D3F;
    --beam-edge: #A8968C;
    --beam-bg: #ECE9D3;
    --rod-outer: #B8A172;
    --rod-center: #F0D48F;
    --bead-orange-top: #F99934;
    --bead-orange-mid: #FAB053;
    --bead-orange-bot: #E16F40;
    --bead-yellow-top: #E8DF81;
    --bead-yellow-mid: #FCEA89;
    --bead-yellow-bot: #EECE67;
    --btn-blue: #3182ce;
    --btn-blue-hover: #2b6cb0;
    --btn-green: #38a169;
    --btn-orange: #dd6b20;
    --font-primary: 'UD デジタル 教科書体 N-R', 'UD Digital Kyokasho-N', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', meiryo, sans-serif;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: var(--font-primary);
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    touch-action: none;
  }

  /* 画面比16:9の全画面レスポンシブコンテナ */
  #app-wrapper {
    width: 1280px;
    height: 720px;
    background-color: #ffffff;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(var(--app-scale, 1));
    transform-origin: center center;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none;
  }

  main {
    flex: 1;
    position: relative;
    padding: 6px 20px 0px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    background-color: #ffffff;
  }

  footer {
    height: 60px;
    background: #ffffff;
    border-top: 1px solid #edf2f7;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    z-index: 20;
    flex-shrink: 0;
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .page-title-badge {
    font-size: 1.25rem;
    font-weight: bold;
    color: var(--frame-wood);
    display: flex;
    align-items: center;
  }

  input::placeholder {
    font-size: 0.95rem !important;
    color: #a0aec0 !important;
    font-weight: normal !important;
  }

  /* トップページボタン */
  .chamfer-btn {
    background: linear-gradient(135deg, var(--bead-yellow-top) 0%, var(--bead-yellow-mid) 50%, var(--bead-yellow-bot) 100%);
    color: var(--frame-wood);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--bead-orange-bot);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 12px;
    position: relative;
  }

  .chamfer-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--bead-orange-bot);
  }

  .menu-btn-num {
    font-size: 1.5rem;
    font-weight: bold;
    opacity: 0.95;
    margin-bottom: 4px;
  }

  .menu-btn-title {
    font-size: 1.5rem;
    font-weight: bold;
    line-height: 1.25;
  }

  .menu-title-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 4px;
  }

  .menu-title-cell h1 {
    font-size: 3.3rem;
    font-weight: 900;
    color: var(--frame-wood);
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .menu-desc-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 8px 4px;
    gap: 12px;
  }

  .menu-desc-cell p {
    font-size: 1.15rem;
    font-weight: bold;
    color: #523329;
    line-height: 1.3;
  }

  .top-grade-btn-group {
    display: inline-flex;
    background: #edf2f7;
    border-radius: 14px;
    padding: 4px;
    gap: 6px;
  }

  .top-grade-btn {
    padding: 8px 22px;
    font-size: 1.25rem;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #4a5568;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .top-grade-btn.active {
    background-color: #dd6b20;
    color: #ffffff;
  }

  /* フッター共通ボタンデザイン */
  .footer-btn {
    height: 40px;
    padding: 0 16px;
    font-size: 0.95rem;
    font-weight: bold;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 2px solid var(--btn-blue);
    background-color: #ffffff;
    color: var(--btn-blue);
    white-space: nowrap;
  }

  .footer-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  #btn-back-top {
    background-color: var(--btn-blue);
    color: #ffffff;
  }

  .footer-btn.active {
    background-color: var(--btn-blue);
    color: #ffffff;
  }

  .sound-btn {
    height: 40px;
    padding: 0 14px;
    font-size: 0.95rem;
    font-weight: bold;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 2px solid #a0aec0;
    background-color: #ffffff;
    color: #4a5568;
  }

  .sound-btn.active {
    background-color: #ed8936;
    border-color: #dd6b20;
    color: #ffffff;
  }

  .grade-btn-group {
    display: inline-flex;
    background: #edf2f7;
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }

  .grade-btn {
    padding: 4px 14px;
    font-size: 0.95rem;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #4a5568;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .grade-btn.active {
    background-color: #dd6b20;
    color: #ffffff;
  }

  .icon-btn {
    padding: 6px 16px;
    background-color: #fff;
    border: 2px solid var(--btn-blue);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: bold;
    color: var(--btn-blue);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn.active {
    background-color: var(--btn-blue);
    color: #ffffff;
  }

  .page {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: absolute;
    top: 0;
    left: 0;
    padding: 6px 16px;
    background-color: #ffffff;
  }

  .page.active {
    display: flex;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 20px;
    width: 96%;
    height: 90%;
    margin-top: 10px;
  }

  .soroban-container-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    position: relative;
    max-width: 100%;
  }

  /* そろばんフレーム（8桁） */
  .soroban-frame {
    background-color: #ffffff;
    border-top: 20px solid var(--frame-wood);
    border-bottom: 20px solid var(--frame-wood);
    border-left: none;
    border-right: none;
    display: flex;
    position: relative;
    box-sizing: content-box;
    touch-action: none;
    height: 410px;
    width: 1134px;
  }

  .soroban-rod {
    flex: 1;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: none;
  }

  .rod-line {
    position: absolute;
    width: 8px;
    height: 100%;
    background: linear-gradient(90deg, var(--rod-outer) 0%, var(--rod-center) 50%, var(--rod-outer) 100%);
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    border-radius: 4px;
    pointer-events: none;
  }

  /* 梁（Beam） */
  .beam {
    position: absolute;
    width: 100%;
    height: 24px;
    background-color: var(--beam-bg);
    border-top: 4px solid var(--beam-edge);
    border-bottom: 4px solid var(--beam-edge);
    top: 115px;
    z-index: 5;
    box-sizing: border-box;
    pointer-events: none;
  }

  /* 定位点（右端の桁 Rod 7 のみ） */
  .unit-dot {
    position: absolute;
    width: 14px;
    height: 14px;
    background-color: #000000;
    border-radius: 50%;
    top: 127px;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 6;
    pointer-events: auto;
    transition: all 0.15s ease;
  }

  .digit-label {
    position: absolute;
    bottom: -52px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.15rem;
    font-weight: bold;
    color: #2d3748;
    background: #ffffff;
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
    border: 2px solid #cbd5e0;
    z-index: 10;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .fraction {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }

  .fraction .numerator {
    border-bottom: 2px solid #2d3748;
    padding: 0 3px 1px 3px;
    font-size: 0.8rem;
    width: 100%;
    text-align: center;
  }

  .fraction .denominator {
    padding-top: 1px;
    font-size: 0.8rem;
    width: 100%;
    text-align: center;
  }

  /* 玉 (bead) */
  .bead {
    width: 137.8px;
    height: 55px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    transition: top 0.12s cubic-bezier(0.25, 1, 0.5, 1), filter 0.15s;
    touch-action: none;
    cursor: pointer;
  }

  .bead-shape {
    width: 100%;
    height: 100%;
    clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
    position: relative;
    background: linear-gradient(180deg, var(--bead-yellow-top) 0%, var(--bead-yellow-mid) 50%, var(--bead-yellow-bot) 100%);
    transition: background 0.15s;
    pointer-events: none;
  }

  .bead.active .bead-shape {
    background: linear-gradient(180deg, var(--bead-orange-top) 0%, var(--bead-orange-mid) 50%, var(--bead-orange-bot) 100%);
  }

  .soroban-bottom-bar {
    width: 1134px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    margin-top: 56px;
  }

  .gohasan-btn, .toggle-label-btn {
    background-color: var(--frame-wood);
    color: #ffffff;
    border: 2px solid #523329;
    border-radius: 10px;
    padding: 6px 18px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .gohasan-btn:hover, .toggle-label-btn:hover {
    background-color: #633e33;
  }

  .gohasan-btn:disabled, .toggle-label-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  .toggle-label-btn.active {
    background-color: #3182ce;
    border-color: #2b6cb0;
  }

  .question-card {
    background: #ffffff;
    border: 3px solid #3182ce;
    border-radius: 12px;
    padding: 2px 24px;
    font-size: 1.4rem;
    font-weight: 900;
    color: #1a202c;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
    display: inline-block;
    text-align: center;
  }

  .demo-controls {
    display: flex;
    gap: 6px;
    align-items: center;
    background: #ffffff;
    padding: 2px 10px;
    border-radius: 30px;
  }

  .key-btn {
    width: 66px;
    height: 66px;
    min-width: 66px;
    padding: 0;
    font-size: 1.875rem;
    font-weight: bold;
    background: linear-gradient(135deg, #ffffff 0%, #f7fafc 100%);
    color: #2d3748;
    border: 2px solid #cbd5e0;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .key-btn:active {
    transform: translateY(2px);
  }

  .key-btn.action-bs {
    width: auto;
    min-width: 120px;
    padding: 0 16px;
    font-size: 1.35rem;
    background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
    color: #e53e3e;
    border-color: #feb2b2;
  }

  .progress-badge {
    font-size: 1.05rem;
    font-weight: bold;
    color: #2b6cb0;
    background: #ebf8ff;
    border: 2px solid #3182ce;
    border-radius: 20px;
    padding: 2px 12px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
  }

  /* 部位解説キャンバス */
  .parts-canvas-container {
    position: relative;
    width: 1134px;
    height: 520px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .part-mask-btn {
    position: absolute;
    background: #38a169;
    color: #ffffff;
    padding: 4px 18px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 1.15rem;
    cursor: pointer;
    z-index: 10;
    border: 2px solid #ffffff;
    transition: transform 0.15s, background-color 0.15s;
  }

  .part-mask-btn:hover {
    transform: scale(1.05);
  }

  .part-mask-btn.revealed {
    background: #2b6cb0;
  }

  .parts-svg-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 8;
    transition: opacity 0.2s ease;
  }

  /* 正解・不正解オーバーレイ */
  #judge-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.4);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
    pointer-events: none;
  }

  #judge-symbol {
    font-size: 18rem;
    line-height: 1;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.2); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 全問クリアモーダル */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 300;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 28px 40px;
    width: 480px;
    max-width: 90%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    position: relative;
  }

  /* 三重円SVG */
  .triple-circle-svg {
    width: 180px;
    height: 180px;
    position: relative;
  }

  .modal-clear-text {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.2rem;
    font-weight: 900;
    color: #e53e3e;
    line-height: 1.15;
    white-space: pre;
    z-index: 50;
    text-shadow: 
      2px 2px 0 #fff, -2px -2px 0 #fff,
      2px -2px 0 #fff, -2px 2px 0 #fff,
      0 2px 0 #fff, 0 -2px 0 #fff,
      2px 0 0 #fff, -2px 0 0 #fff;
  }

  .error-mark-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    pointer-events: none;
    animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: rgba(255, 255, 255, 0.92);
    border-radius: 50%;
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4.5rem;
    line-height: 1;
    border: 4px solid #e53e3e;
  }
</style>
</head>
<body oncontextmenu="return false;">

<div id="app-wrapper">
  <main id="main-area">

    <!-- ① トップページ -->
    <div id="page-1" class="page active">
      <div class="menu-grid">
        <div class="menu-title-cell">
          <h1>そろばん</h1>
          <svg viewBox="0 0 180 65" width="160" height="58" style="margin-top: 14px;">
            <rect x="0" y="0" width="180" height="65" fill="#ffffff" />
            <rect x="0" y="0" width="180" height="8" fill="#784D3F"/>
            <rect x="0" y="57" width="180" height="8" fill="#784D3F"/>
            
            <g stroke="#B8A172" stroke-width="2">
              <line x1="13" y1="8" x2="13" y2="57"/>
              <line x1="38" y1="8" x2="38" y2="57"/>
              <line x1="64" y1="8" x2="64" y2="57"/>
              <line x1="90" y1="8" x2="90" y2="57"/>
              <line x1="116" y1="8" x2="116" y2="57"/>
              <line x1="141" y1="8" x2="141" y2="57"/>
              <line x1="167" y1="8" x2="167" y2="57"/>
            </g>
            
            <rect x="0" y="21" width="180" height="5" fill="#ECE9D3" stroke="#A8968C" stroke-width="1"/>
            <circle cx="167" cy="23.5" r="1.5" fill="#000"/>

            <polygon points="13,8 21,12 13,16 5,12" fill="url(#yellow-grad)"/>
            <polygon points="38,13 46,17 38,21 30,17" fill="url(#orange-grad)"/>
            <polygon points="64,8 72,12 64,16 56,12" fill="url(#yellow-grad)"/>
            <polygon points="90,13 98,17 90,21 82,17" fill="url(#orange-grad)"/>
            <polygon points="116,8 124,12 116,16 108,12" fill="url(#yellow-grad)"/>
            <polygon points="141,13 149,17 141,21 133,17" fill="url(#orange-grad)"/>
            <polygon points="167,8 175,12 167,16 159,12" fill="url(#yellow-grad)"/>

            <defs>
              <linearGradient id="yellow-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#E8DF81"/>
                <stop offset="50%" stop-color="#FCEA89"/>
                <stop offset="100%" stop-color="#EECE67"/>
              </linearGradient>
              <linearGradient id="orange-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#F99934"/>
                <stop offset="50%" stop-color="#FAB053"/>
                <stop offset="100%" stop-color="#E16F40"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="menu-desc-cell">
          <p>学年をえらびましょう</p>
          <div class="top-grade-btn-group">
            <button class="top-grade-btn active" id="top-grade-3" onclick="setGlobalGrade(3)">3年</button>
            <button class="top-grade-btn" id="top-grade-4" onclick="setGlobalGrade(4)">4年</button>
          </div>
        </div>
        <button class="chamfer-btn" onclick="goToPage(2)">
          <span class="menu-btn-num">①</span>
          <span class="menu-btn-title">拡大そろばん</span>
        </button>
        <button class="chamfer-btn" onclick="goToPage(3)">
          <span class="menu-btn-num">②</span>
          <span class="menu-btn-title">そろばんの名前</span>
        </button>

        <button class="chamfer-btn" onclick="goToPage(4)">
          <span class="menu-btn-num">③</span>
          <span class="menu-btn-title">数をよもう</span>
        </button>
        <button class="chamfer-btn" onclick="goToPage(5)">
          <span class="menu-btn-num">④</span>
          <span class="menu-btn-title">数を入れよう</span>
        </button>
        <button class="chamfer-btn" onclick="goToPage(6)">
          <span class="menu-btn-num">⑤</span>
          <span class="menu-btn-title">たし算・ひき算</span>
        </button>
        <button class="chamfer-btn" onclick="goToPage(7)">
          <span class="menu-btn-num">⑥</span>
          <span class="menu-btn-title">1～10までたすと</span>
        </button>
      </div>
    </div>

    <!-- ② 拡大そろばん -->
    <div id="page-2" class="page">
      <div class="soroban-container-wrapper">
        <div id="soroban-p2" class="soroban-frame"></div>
        <div class="soroban-bottom-bar">
          <button class="gohasan-btn" id="p2-gohasan-btn" onclick="resetP2Board()">ご破算</button>
          <button class="toggle-label-btn" id="p2-toggle-label-btn" onclick="toggleDigitLabels('p2')">位：非表示</button>
        </div>

<script>
/* -------------------------------------------------------------
 * 1. 音源・サウンドエフェクト
 * ------------------------------------------------------------- */
let soundEnabled = true;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-toggle-btn');
  const text = document.getElementById('sound-text');
  const icon = document.getElementById('sound-icon');
  
  if (soundEnabled) {
    btn.classList.add('active');
    text.textContent = "音:ON";
    icon.textContent = "🔊";
  } else {
    btn.classList.remove('active');
    text.textContent = "音:OFF";
    icon.textContent = "🔇";
  }
}

function playBeadSound() {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  const bufferSize = ctx.sampleRate * 0.04;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(1200 + Math.random() * 300, ctx.currentTime);
  filter.Q.setValueAtTime(3.0, ctx.currentTime);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.6, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.035);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  noise.start();
}

function playCorrectSound() {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  const now = ctx.currentTime;
  const osc1 = ctx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(659.25, now);
  osc1.frequency.setValueAtTime(880, now + 0.15);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

  osc1.connect(gain);
  gain.connect(ctx.destination);

  osc1.start(now);
  osc1.stop(now + 0.6);
}

function playIncorrectSound() {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(150, now);
  osc.frequency.setValueAtTime(110, now + 0.18);

  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now + 0.4);
}

function playFanfareSound() {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((freq, idx) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const start = ctx.currentTime + idx * 0.12;

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, start);

    gain.gain.setValueAtTime(0.3, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + (idx === 3 ? 0.8 : 0.25));

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(start);
    osc.stop(start + (idx === 3 ? 0.8 : 0.25));
  });
}

/* -------------------------------------------------------------
 * 2. アプリ全体の基盤設定
 * ------------------------------------------------------------- */
let globalGrade = 3;
let currentPage = 1;

function updateAppScale() {
  const wrapper = document.getElementById('app-wrapper');
  const targetW = 1280;
  const targetH = 720;
  const winW = window.innerWidth;
  const winH = window.innerHeight;

  const scale = Math.min(winW / targetW, winH / targetH);
  wrapper.style.setProperty('--app-scale', scale);
}

window.addEventListener('resize', updateAppScale);
window.addEventListener('DOMContentLoaded', updateAppScale);

function setGlobalGrade(grade) {
  globalGrade = grade;
  
  ['top-grade-3', 'p3-grade-3', 'p4-grade-3', 'p5-grade-3', 'p6-grade-3'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      if (grade === 3) el.classList.add('active');
      else el.classList.remove('active');
    }
  });

  ['top-grade-4', 'p3-grade-4', 'p4-grade-4', 'p5-grade-4', 'p6-grade-4'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      if (grade === 4) el.classList.add('active');
      else el.classList.remove('active');
    }
  });

  if (currentPage === 3) {
    initP3Board();
  } else {
    Object.keys(boards).forEach(pageId => {
      if (boards[pageId]) {
        boards[pageId].updateDigitLabels();
      }
    });
  }

  if (currentPage === 4) initP4Problem();
  if (currentPage === 5) initP5Problem();
  if (currentPage === 6) initP6Problem();
}

/* -------------------------------------------------------------
 * 3. そろばんエンジン (SorobanBoard Class)
 * ------------------------------------------------------------- */
class SorobanBoard {
  constructor(containerId, options = {}) {
    this.container = document.getElementById(containerId);
    this.numRods = options.numRods || 8;
    this.showLabels = options.showLabels !== undefined ? options.showLabels : false;
    this.isInteractive = options.isInteractive !== undefined ? options.isInteractive : true;
    this.isLocked = false;
    
    // 状態: { top: 0|1, bot: 0~4 }
    this.state = Array.from({ length: this.numRods }, () => ({ top: 0, bot: 0 }));
    this.beadElements = [];
    this.labelElements = [];
    this.unitDotElements = [];

    this.render();
  }

  render() {
    this.container.innerHTML = '';
    this.beadElements = [];
    this.labelElements = [];
    this.unitDotElements = [];

    const beam = document.createElement('div');
    beam.className = 'beam';
    this.container.appendChild(beam);

    for (let r = 0; r < this.numRods; r++) {
      const rod = document.createElement('div');
      rod.className = 'soroban-rod';
      rod.dataset.rod = r;

      const rodLine = document.createElement('div');
      rodLine.className = 'rod-line';
      rod.appendChild(rodLine);

      // 定位点: 一番右の桁（軸: index 7）のみに配置
      if (r === 7) {
        const unitDot = document.createElement('div');
        unitDot.className = 'unit-dot';
        rod.appendChild(unitDot);
        this.unitDotElements.push(unitDot);
      }

      const label = document.createElement('div');
      label.className = 'digit-label';
      label.style.display = this.showLabels ? 'flex' : 'none';
      rod.appendChild(label);
      this.labelElements.push(label);

      // 五玉: OFF(上枠ピッタリ 0px) / ON(梁上辺ピッタリ 60px)
      const topBead = document.createElement('div');
      topBead.className = 'bead top-bead';
      topBead.dataset.rod = r;
      topBead.dataset.type = 'top';
      topBead.innerHTML = '<div class="bead-shape"></div>';
      topBead.style.top = '0px';
      rod.appendChild(topBead);

      // 一玉 (4つ): OFF(下枠ピッタリ) / ON(梁下辺ピッタリ)
      // 下枠の可動域: 梁下 139px から 下フレーム0px (410px)
      // 各玉の高さ h = 55px. 4個合計 220px.
      // OFF位置: 最下段ピッタリ (355px, 300px, 245px, 190px)
      // ON位置: 梁下ピッタリ (139px, 194px, 249px, 304px)
      const botBeads = [];
      for (let b = 0; b < 4; b++) {
        const botBead = document.createElement('div');
        botBead.className = 'bead bot-bead';
        botBead.dataset.rod = r;
        botBead.dataset.type = 'bot';
        botBead.dataset.index = b;
        botBead.innerHTML = '<div class="bead-shape"></div>';
        botBead.style.top = `${190 + b * 55}px`;
        rod.appendChild(botBead);
        botBeads.push(botBead);
      }

      this.beadElements.push({ top: topBead, bot: botBeads });

      rod.addEventListener('pointerdown', (e) => this.handlePointerDown(e, r));
      this.container.appendChild(rod);
    }

    this.updateDigitLabels();
    this.updateBeadPositions(false);
  }

  handlePointerDown(e, rodIndex) {
    if (!this.isInteractive || this.isLocked) return;
    getAudioContext();
    const target = e.target.closest('.bead');
    if (!target) return;

    const type = target.dataset.type;
    if (type === 'top') {
      this.state[rodIndex].top = this.state[rodIndex].top === 1 ? 0 : 1;
      playBeadSound();
    } else if (type === 'bot') {
      const idx = parseInt(target.dataset.index, 10);
      const currentBot = this.state[rodIndex].bot;
      if (idx < currentBot) {
        this.state[rodIndex].bot = idx;
      } else {
        this.state[rodIndex].bot = idx + 1;
      }
      playBeadSound();
    }

    this.updateBeadPositions(true);
  }

  updateBeadPositions(animate = true) {
    for (let r = 0; r < this.numRods; r++) {
      const st = this.state[r];
      const beads = this.beadElements[r];

      // 五玉: OFF = 0px (上枠密着), ON = 60px (梁上辺密着)
      if (st.top === 1) {
        beads.top.style.top = '60px';
        beads.top.classList.add('active');
      } else {
        beads.top.style.top = '0px';
        beads.top.classList.remove('active');
      }

      // 一玉 (4つ)
      for (let b = 0; b < 4; b++) {
        const bead = beads.bot[b];
        if (b < st.bot) {
          // ON (上がっている): 梁下辺 139px から密着
          bead.style.top = `${139 + b * 55}px`;
          bead.classList.add('active');
        } else {
          // OFF (下がっている): 下枠 410px から密着
          bead.style.top = `${190 + b * 55}px`;
          bead.classList.remove('active');
        }
      }
    }
  }

  updateDigitLabels() {
    // 指定順序（左から順に）: 「万」「千」「百」「十」「一」「1/10」「1/100」「1/1000」
    const labels = ["万", "千", "百", "十", "一", "1/10", "1/100", "1/1000"];

    for (let r = 0; r < this.numRods; r++) {
      const label = this.labelElements[r];
      const text = labels[r];

      if (text.includes('/')) {
        const [num, den] = text.split('/');
        label.innerHTML = `<div class="fraction"><span class="numerator">${num}</span><span class="denominator">${den}</span></div>`;
      } else {
        label.textContent = text;
      }
    }
  }

  toggleLabels() {
    this.showLabels = !this.showLabels;
    for (let r = 0; r < this.numRods; r++) {
      this.labelElements[r].style.display = this.showLabels ? 'flex' : 'none';
    }
    return this.showLabels;
  }

  setLock(locked) {
    this.isLocked = locked;
  }

  reset() {
    for (let r = 0; r < this.numRods; r++) {
      this.state[r].top = 0;
      this.state[r].bot = 0;
    }
    this.updateBeadPositions(true);
  }

  getValue() {
    // Rod 4 が 一の位
    let val = 0;
    const basePow = [10000, 1000, 100, 10, 1, 0.1, 0.01, 0.001];
    for (let r = 0; r < this.numRods; r++) {
      const rodVal = this.state[r].top * 5 + this.state[r].bot;
      val += rodVal * basePow[r];
    }
    return Math.round(val * 1000) / 1000;
  }

  setValue(num) {
    this.reset();
    let remaining = Math.round(Math.abs(num) * 1000);
    const factors = [10000000, 1000000, 100000, 10000, 1000, 100, 10, 1];

    for (let r = 0; r < this.numRods; r++) {
      const digit = Math.floor(remaining / factors[r]) % 10;
      if (digit >= 5) {
        this.state[r].top = 1;
        this.state[r].bot = digit - 5;
      } else {
        this.state[r].top = 0;
        this.state[r].bot = digit;
      }
    }
    this.updateBeadPositions(true);
  }
}

function initP6Problem() {

function p6NextQuestion() {
  if (p6Stage === 1) {
    p6TotalSteps = globalGrade === 3 ? (p6Mode === 'rand' ? 12 : 6) : (p6Mode === 'rand' ? 6 : 3);
  } else if (p6Stage === 2) {

  document.getElementById('p6-progress-badge').textContent = `${p6Step} / ${p6TotalSteps}`;
  boards['p6'].reset(); // 初期状態：ご破算

  if (p6Stage === 1) {
    if (globalGrade === 3) {
      const adds = [[63,25], [48,51], [63,31], [25,23], [17,82], [12,67]];
      const subs = [[48,36], [34,12], [68,52], [78,63], [83,73], [99,18]];
      
      let item;
      if (p6Mode === 'add') {
        item = adds[(p6Step - 1) % adds.length];
        p6Op = '+';
      } else if (p6Mode === 'sub') {
        item = subs[(p6Step - 1) % subs.length];
        p6Op = '-';
      } else {
        const mix = [...adds.map(a => [...a, '+']), ...subs.map(s => [...s, '-'])];
        item = mix[(p6Step - 1) % mix.length];
        p6Op = item[2];
      }
      p6Num1 = item[0];
      p6Num2 = item[1];
    } else {
      const adds = [[2.47,3.63], [4.96,3.59], [3.87,7.28]];
      const subs = [[1.25,0.86], [2.43,1.78], [5.14,3.96]];
      
      let item;
      if (p6Mode === 'add') {
        item = adds[(p6Step - 1) % adds.length];
        p6Op = '+';
      } else if (p6Mode === 'sub') {
        item = subs[(p6Step - 1) % subs.length];
        p6Op = '-';
      } else {
        const mix = [...adds.map(a => [...a, '+']), ...subs.map(s => [...s, '-'])];
        item = mix[(p6Step - 1) % mix.length];
        p6Op = item[2];
      }
      p6Num1 = item[0];
      p6Num2 = item[1];
    }
  } else {
    // ステージ2, 3...
    if (p6Stage === 2 || p6Stage === 3) {
      const prob = generateP6RandomProblem();
      p6Num1 = prob.n1;
      p6Num2 = prob.n2;
      p6Op = prob.op;
      p6PoolHistory.push(prob);
    } else {
      if (p6PoolHistory.length === 0) {
        const prob = generateP6RandomProblem();
        p6Num1 = prob.n1;
        p6Num2 = prob.n2;
        p6Op = prob.op;
      } else {
        const prob = p6PoolHistory[Math.floor(Math.random() * p6PoolHistory.length)];
        p6Num1 = prob.n1;
        p6Num2 = prob.n2;
        p6Op = prob.op;
      }
    }
  }

  p6AnsVal = p6Op === '+' ? Math.round((p6Num1 + p6Num2) * 1000) / 1000 : Math.round((p6Num1 - p6Num2) * 1000) / 1000;
  document.getElementById('p6-q-title').textContent = `${p6Num1} ${p6Op} ${p6Num2} = ?`;
}

function generateP6RandomProblem() {
  let op = p6Mode;
  if (op === 'rand') op = Math.random() < 0.5 ? 'add' : 'sub';

  if (globalGrade === 3) {
    // 繰り上がり/下がりなしの2桁
    const n1 = Math.floor(Math.random() * 40) + 10;
    const n2 = Math.floor(Math.random() * 40) + 10;
    return { n1, n2, op: op === 'add' ? '+' : '-' };
  } else {
    // 1桁整数.小数第2位
    const n1 = Math.round((Math.random() * 5 + 2) * 100) / 100;
    const n2 = Math.round((Math.random() * 2 + 1) * 100) / 100;
    return { n1, n2, op: op === 'add' ? '+' : '-' };
  }
}

  await new Promise(r => setTimeout(r, 200));

  const strVal = p4CurrentVal.toString();
  const digits = [];
  
  // 桁ごとの積み上げ数値を作成
  let tempBoard = new SorobanBoard('temp-b', { numRods: 8 });
  tempBoard.setValue(p4CurrentVal);
  
  for (let r = 0; r < 8; r++) {
    const val = tempBoard.state[r].top * 5 + tempBoard.state[r].bot;
    if (val > 0) {
      // 当該桁をセット
      board.state[r].top = tempBoard.state[r].top;

      board.updateBeadPositions(true);
      playBeadSound();
      await new Promise(r => setTimeout(r, demoSpeedBase));
    }
  }

  // 1秒後に自動ご破算
  await new Promise(r => setTimeout(r, 1000));
  board.reset();
  setControlsDisabled('p4', false);
}

// ページ⑤ デモ（数を入れる）
async function startP5Demo() {
  setControlsDisabled('p5', true);
  const board = boards['p5'];
  board.reset();
  await new Promise(r => setTimeout(r, 200));

  let tempBoard = new SorobanBoard('temp-b5', { numRods: 8 });
  tempBoard.setValue(p5TargetVal);
  
  for (let r = 0; r < 8; r++) {
    const st = tempBoard.state[r];
    if (st.top > 0 || st.bot > 0) {
      if (st.top > 0) {
        board.state[r].top = 1;
        board.updateBeadPositions(true);
        playBeadSound();
        await new Promise(r => setTimeout(r, demoSpeedBase * 0.5));
      }
      if (st.bot > 0) {
        board.state[r].bot = st.bot;
        board.updateBeadPositions(true);
        playBeadSound();
        await new Promise(r => setTimeout(r, demoSpeedBase));
      }
    }
  }

  await new Promise(r => setTimeout(r, 1000));
  board.reset();
  setControlsDisabled('p5', false);
}

// ページ⑥ デモ（たし算・ひき算）
async function startP6Demo() {
  setControlsDisabled('p6', true);
  const board = boards['p6'];
  board.reset();
  await new Promise(r => setTimeout(r, 200));

  // 1. 被加数 / 被減数 を入力
  board.setValue(p6Num1);
  playBeadSound();
  await new Promise(r => setTimeout(r, demoSpeedBase));

  // 補数ステップ判定の例示デモ
  // 補数（5/10の繰り上がり・繰り下がり）の中間状態「・」を挟んで表示
  const isComplement = (p6Op === '+' && (p6Num1 % 10 + p6Num2 % 10 >= 10)) || (p6Op === '-' && (p6Num1 % 10 < p6Num2 % 10));

  if (isComplement) {
    // 中間「・」ステップ
    await new Promise(r => setTimeout(r, demoSpeedBase * 0.5));
    playBeadSound();
  }

  // 2. 最終計算結果
  board.setValue(p6AnsVal);
  playBeadSound();
  await new Promise(r => setTimeout(r, demoSpeedBase));

  // 自動ご破算と解除
  await new Promise(r => setTimeout(r, 1000));
  board.reset();
  setControlsDisabled('p6', false);
}

// ページ⑦ デモ（1～10までたす）
async function startP7Demo() {
  setControlsDisabled('p7', true);
  const board = boards['p7'];
  board.reset();
  await new Promise(r => setTimeout(r, 200));

  let currentVal = 0;
  for (let add = 1; add <= 10; add++) {
    currentVal += add;
    board.setValue(currentVal);
    playBeadSound();
    await new Promise(r => setTimeout(r, demoSpeedBase));
  }

  await new Promise(r => setTimeout(r, 1000));
  board.reset();
  setControlsDisabled('p7', false);
}

/* -------------------------------------------------------------
 * 7. 判定とモーダル管理
 * ------------------------------------------------------------- */
function showJudge(isCorrect) {
  const overlay = document.getElementById('judge-overlay');
  const symbol = document.getElementById('judge-symbol');

  if (isCorrect) {
    symbol.textContent = '⭕';
    symbol.style.color = '#e53e3e';
  } else {
    symbol.textContent = '❌';
    symbol.style.color = '#3182ce';
  }

  overlay.style.display = 'flex';
  setTimeout(() => {
    overlay.style.display = 'none';
  }, 800);
}

function showClearModal() {
  playFanfareSound();
  const modal = document.getElementById('clear-modal');
  modal.classList.add('active');
}

function closeClearModal() {
  const modal = document.getElementById('clear-modal');
  modal.classList.remove('active');

  // ステージ進行
  if (currentPage === 4) {
    p4Stage++;
    p4Step = 1;
    p4NextQuestion();
  } else if (currentPage === 5) {
    p5Stage++;
    p5Step = 1;
    p5NextQuestion();
  } else if (currentPage === 6) {
    p6Stage++;
    p6Step = 1;
    p6NextQuestion();
  } else if (currentPage === 7) {
    initP7Problem();
  } else {
    goToPage(1);
  }
}
