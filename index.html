<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>そろばん</title>

<style>
  :root {
    --bg-main: #ffffff;
    --frame-wood: #784D3F;
    --beam-edge: #A8968C;
    --beam-bg: #ECE9D3;
    --rod-outer: #B8A172;
    --rod-center: #F0D48F;
    --bead-orange-top: #F99934;
    --bead-orange-mid: #FAB053;
    --bead-orange-bot: #E16F40;
    --bead-yellow-top: #E8DF81;
    --bead-yellow-mid: #FCEA89;
    --bead-yellow-bot: #EECE67;
    --btn-blue: #3182ce;
    --btn-blue-hover: #2b6cb0;
    --btn-green: #38a169;
    --btn-orange: #dd6b20;
    --font-primary: 'UD デジタル 教科書体 N-R', 'UD Digital Kyokasho-N', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', meiryo, sans-serif;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: var(--font-primary);
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f7fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    touch-action: none;
  }

  #app-wrapper {
    width: 1280px;
    height: 720px;
    background-color: #ffffff;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(var(--app-scale, 1));
    transform-origin: center center;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  }

  main {
    flex: 1;
    position: relative;
    padding: 6px 20px 0px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    background-color: #ffffff;
  }

  footer {
    height: 60px;
    background: #ffffff;
    border-top: 1px solid #edf2f7;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    z-index: 20;
    flex-shrink: 0;
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .page-title-badge {
    font-size: 1.25rem;
    font-weight: bold;
    color: var(--frame-wood);
    display: flex;
    align-items: center;
  }

  input::placeholder {
    font-size: 0.95rem !important;
    color: #a0aec0 !important;
    font-weight: normal !important;
  }

  .chamfer-btn {
    background: linear-gradient(135deg, var(--bead-yellow-top) 0%, var(--bead-yellow-mid) 50%, var(--bead-yellow-bot) 100%);
    color: var(--frame-wood);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--bead-orange-bot);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 12px;
    position: relative;
  }

  .chamfer-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--bead-orange-bot);
  }

  .menu-btn-num {
    font-size: 1.5rem;
    font-weight: bold;
    opacity: 0.95;
    margin-bottom: 4px;
  }

  .menu-btn-title {
    font-size: 1.5rem;
    font-weight: bold;
    line-height: 1.25;
  }

  .menu-title-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 4px;
  }

  .menu-title-cell h1 {
    font-size: 3.3rem;
    font-weight: 900;
    color: var(--frame-wood);
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .menu-desc-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 8px 4px;
    gap: 12px;
  }

  .menu-desc-cell p {
    font-size: 1.15rem;
    font-weight: bold;
    color: #523329;
    line-height: 1.3;
  }

  .top-grade-btn-group {
    display: inline-flex;
    background: #edf2f7;
    border-radius: 14px;
    padding: 4px;
    gap: 6px;
  }

  .top-grade-btn {
    padding: 8px 22px;
    font-size: 1.25rem;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #4a5568;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .top-grade-btn.active {
    background-color: #dd6b20;
    color: #ffffff;
  }

  .footer-btn {
    height: 40px;
    padding: 0 16px;
    font-size: 0.95rem;
    font-weight: bold;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 2px solid var(--btn-blue);
    background-color: #ffffff;
    color: var(--btn-blue);
    white-space: nowrap;
  }

  .footer-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  #btn-back-top {
    background-color: var(--btn-blue);
    color: #ffffff;
  }

  .footer-btn.active {
    background-color: var(--btn-blue);
    color: #ffffff;
  }

  .sound-btn {
    height: 40px;
    padding: 0 14px;
    font-size: 0.95rem;
    font-weight: bold;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 2px solid #a0aec0;
    background-color: #ffffff;
    color: #4a5568;
  }

  .sound-btn.active {
    background-color: #ed8936;
    border-color: #dd6b20;
    color: #ffffff;
  }

  .grade-btn-group {
    display: inline-flex;
    background: #edf2f7;
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }

  .grade-btn {
    padding: 4px 14px;
    font-size: 0.95rem;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #4a5568;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .grade-btn.active {
    background-color: #dd6b20;
    color: #ffffff;
  }

  .icon-btn {
    padding: 6px 16px;
    background-color: #fff;
    border: 2px solid var(--btn-blue);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: bold;
    color: var(--btn-blue);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn.active {
    background-color: var(--btn-blue);
    color: #ffffff;
  }

  .page {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: absolute;
    top: 0;
    left: 0;
    padding: 6px 16px;
    background-color: #ffffff;
  }

  .page.active {
    display: flex;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 20px;
    width: 96%;
    height: 90%;
    margin-top: 10px;
  }

  .soroban-container-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    position: relative;
    max-width: 100%;
  }

  .soroban-frame {
    background-color: #ffffff;
    border-top: 20px solid var(--frame-wood);
    border-bottom: 20px solid var(--frame-wood);
    border-left: none;
    border-right: none;
    display: flex;
    position: relative;
    box-sizing: content-box;
    touch-action: none;
    height: 410px;
    width: 1134px;
  }

  .soroban-rod {
    flex: 1;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: none;
  }

  .rod-line {
    position: absolute;
    width: 8px;
    height: 100%;
    background: linear-gradient(90deg, var(--rod-outer) 0%, var(--rod-center) 50%, var(--rod-outer) 100%);
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    border-radius: 4px;
    pointer-events: none;
  }

  .beam {
    position: absolute;
    width: 100%;
    height: 24px;
    background-color: var(--beam-bg);
    border-top: 4px solid var(--beam-edge);
    border-bottom: 4px solid var(--beam-edge);
    top: 115px;
    z-index: 5;
    box-sizing: border-box;
    pointer-events: none;
  }

  .unit-dot {
    position: absolute;
    width: 14px;
    height: 14px;
    background-color: #000000;
    border-radius: 50%;
    top: 127px;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 6;
    pointer-events: auto;
    transition: all 0.15s ease;
    box-sizing: border-box;
  }

  .unit-dot.red-border {
    border: 2.5px solid #e53e3e;
  }

  .digit-label {
    position: absolute;
    bottom: -52px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.15rem;
    font-weight: bold;
    color: #2d3748;
    background: #ffffff;
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
    border: 2px solid #cbd5e0;
    z-index: 10;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .fraction {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }

  .fraction .numerator {
    border-bottom: 2px solid #2d3748;
    padding: 0 3px 1px 3px;
    font-size: 0.8rem;
    width: 100%;
    text-align: center;
  }

  .fraction .denominator {
    padding-top: 1px;
    font-size: 0.8rem;
    width: 100%;
    text-align: center;
  }

  .bead {
    width: 137.8px;
    height: 55px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    transition: top 0.12s cubic-bezier(0.25, 1, 0.5, 1), filter 0.15s;
    touch-action: none;
    cursor: pointer;
  }

  .bead-shape {
    width: 100%;
    height: 100%;
    clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
    position: relative;
    background: linear-gradient(180deg, var(--bead-yellow-top) 0%, var(--bead-yellow-mid) 50%, var(--bead-yellow-bot) 100%);
    transition: background 0.15s;
    pointer-events: none;
  }

  .bead.active .bead-shape {
    background: linear-gradient(180deg, var(--bead-orange-top) 0%, var(--bead-orange-mid) 50%, var(--bead-orange-bot) 100%);
  }

  .soroban-bottom-bar {
    width: 1134px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    margin-top: 56px;
  }

  .gohasan-btn, .toggle-label-btn {
    background-color: var(--frame-wood);
    color: #ffffff;
    border: 2px solid #523329;
    border-radius: 10px;
    padding: 6px 18px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .gohasan-btn:hover, .toggle-label-btn:hover {
    background-color: #633e33;
  }

  .gohasan-btn:disabled, .toggle-label-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }

  .toggle-label-btn.active {
    background-color: #3182ce;
    border-color: #2b6cb0;
  }

  .question-card {
    background: #ffffff;
    border: 3px solid #3182ce;
    border-radius: 12px;
    padding: 2px 24px;
    font-size: 1.4rem;
    font-weight: 900;
    color: #1a202c;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
    display: inline-block;
    text-align: center;
  }

  .demo-controls {
    display: flex;
    gap: 6px;
    align-items: center;
    background: #ffffff;
    padding: 2px 10px;
    border-radius: 30px;
  }

  .key-btn {
    width: 66px;
    height: 66px;
    min-width: 66px;
    padding: 0;
    font-size: 1.875rem;
    font-weight: bold;
    background: linear-gradient(135deg, #ffffff 0%, #f7fafc 100%);
    color: #2d3748;
    border: 2px solid #cbd5e0;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .key-btn:active {
    transform: translateY(2px);
  }

  .key-btn.action-bs {
    width: auto;
    min-width: 120px;
    padding: 0 16px;
    font-size: 1.35rem;
    background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
    color: #e53e3e;
    border-color: #feb2b2;
  }

  .progress-badge {
    font-size: 1.05rem;
    font-weight: bold;
    color: #2b6cb0;
    background: #ebf8ff;
    border: 2px solid #3182ce;
    border-radius: 20px;
    padding: 2px 12px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
  }

  .parts-canvas-container {
    position: relative;
    width: 1134px;
    height: 520px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .part-mask-btn {
    position: absolute;
    background: #38a169;
    color: #ffffff;
    padding: 4px 18px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 1.15rem;
    cursor: pointer;
    z-index: 10;
    border: 2px solid #ffffff;
    transition: transform 0.15s, background-color 0.15s;
  }

  .part-mask-btn:hover {
    transform: scale(1.05);
  }

  .part-mask-btn.revealed {
    background: #2b6cb0;
  }

  .parts-svg-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 8;
    transition: opacity 0.2s ease;
  }

  #judge-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.4);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
    pointer-events: none;
  }

  #judge-symbol {
    font-size: 18rem;
    line-height: 1;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.2); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 300;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 28px 40px;
    width: 480px;
    max-width: 90%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
    position: relative;
  }

  .triple-circle-svg {
    width: 180px;
    height: 180px;
    position: relative;
  }

  .modal-clear-text {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.2rem;
    font-weight: 900;
    color: #e53e3e;
    line-height: 1.15;
    white-space: pre;
    z-index: 50;
    text-shadow: 
      2px 2px 0 #fff, -2px -2px 0 #fff,
      2px -2px 0 #fff, -2px 2px 0 #fff,
      0 2px 0 #fff, 0 -2px 0 #fff,
      2px 0 0 #fff, -2px 0 0 #fff;
  }
</style>
</head>

<script>
let globalGrade = 3;
let currentPage = 1;
let soundEnabled = true;
let audioCtx = null;

// Scales the app layout responsively to fit the viewport dimensions
function updateAppScale() {
  const wrapper = document.getElementById('app-wrapper');
  if (!wrapper) return;
  const targetWidth = 1280;
  const targetHeight = 720;
  const scaleX = window.innerWidth / targetWidth;
  const scaleY = window.innerHeight / targetHeight;
  const scale = Math.min(scaleX, scaleY);
  document.documentElement.style.setProperty('--app-scale', scale);
}

window.addEventListener('resize', updateAppScale);

function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-toggle-btn');
  const icon = document.getElementById('sound-icon');
  const text = document.getElementById('sound-text');
  if (btn && icon && text) {
    if (soundEnabled) {
      btn.classList.add('active');
      icon.textContent = '🔊';
      text.textContent = '音:ON';
    } else {
      btn.classList.remove('active');
      icon.textContent = '🔇';
      text.textContent = '音:OFF';
    }
  }
}

function playBeadSound() {
  if (!soundEnabled) return;
  getAudioContext();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;

    // Noise burst
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.012);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(2800 + Math.random() * 600, now);
    noiseFilter.Q.setValueAtTime(1.8, now);

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.35, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.012);

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);

    // Wood resonance tone
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = 'triangle';
    const baseFreq = 1400 + Math.random() * 250;
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(160, now + 0.02);

    oscGain.gain.setValueAtTime(0.28, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

    osc.connect(oscGain);
    oscGain.connect(audioCtx.destination);

    noise.start(now);
    osc.start(now);
    osc.stop(now + 0.02);
  } catch(e) {}
}

function playCorrectSound() {
  if (!soundEnabled) return;
  getAudioContext();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.frequency.setValueAtTime(659.25, now);
    osc2.frequency.setValueAtTime(880, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.1);
    osc2.start(now + 0.1);
    osc2.stop(now + 0.4);
  } catch(e) {}
}

function playIncorrectSound() {
  if (!soundEnabled) return;
  getAudioContext();
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.setValueAtTime(120, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  } catch(e) {}
}

function playFanfareSound() {
  if (!soundEnabled) return;
  getAudioContext();
  if (!audioCtx) return;
  try {
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime + idx * 0.12;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    });
  } catch(e) {}
}

function setGlobalGrade(grade) {
  globalGrade = grade;
  if (document.activeElement && typeof document.activeElement.blur === 'function') {
    document.activeElement.blur();
  }
  
  ['top-grade-3', 'p3-grade-3', 'p4-grade-3', 'p5-grade-3', 'p6-grade-3'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      if (grade === 3) el.classList.add('active');
      else el.classList.remove('active');
    }
  });

  ['top-grade-4', 'p3-grade-4', 'p4-grade-4', 'p5-grade-4', 'p6-grade-4'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      if (grade === 4) el.classList.add('active');
      else el.classList.remove('active');
    }
  });

  if (currentPage === 3) {
    initP3Board();
  } else {
    Object.keys(boards).forEach(pageId => {
      if (boards[pageId]) {
        boards[pageId].updateDigitLabels();
      }
    });
  }

  if (currentPage === 4) initP4Problem();
  if (currentPage === 5) initP5Problem();
  if (currentPage === 6) initP6Problem();
}

class SorobanBoard {
  constructor(containerId, options = {}) {
    this.container = typeof containerId === 'string' ? document.getElementById(containerId) : containerId;
    this.numRods = options.numRods || 8;
    this.showLabels = options.showLabels !== undefined ? options.showLabels : false;
    this.isInteractive = options.isInteractive !== undefined ? options.isInteractive : true;
    this.isLocked = false;
    
    this.state = Array.from({ length: this.numRods }, () => ({ top: 0, bot: 0 }));
    this.beadElements = [];
    this.labelElements = [];
    this.unitDotElements = [];

    if (this.container) {
      this.render();
    }
  }

  render() {
    if (!this.container) return;
    this.container.innerHTML = '';
    this.beadElements = [];
    this.labelElements = [];
    this.unitDotElements = [];

    const beam = document.createElement('div');
    beam.className = 'beam';
    this.container.appendChild(beam);

    for (let r = 0; r < this.numRods; r++) {
      const rod = document.createElement('div');
      rod.className = 'soroban-rod';
      rod.dataset.rod = r;

      const rodLine = document.createElement('div');
      rodLine.className = 'rod-line';
      rod.appendChild(rodLine);

      const rightIndex = this.numRods - r;
      if (rightIndex === 1 || rightIndex === 4 || rightIndex === 7) {
        const unitDot = document.createElement('div');
        unitDot.className = 'unit-dot' + (rightIndex === 4 ? ' red-border' : '');
        rod.appendChild(unitDot);
        this.unitDotElements.push(unitDot);
      }

      const label = document.createElement('div');
      label.className = 'digit-label';
      label.style.display = this.showLabels ? 'flex' : 'none';
      rod.appendChild(label);
      this.labelElements.push(label);

      const topBead = document.createElement('div');
      topBead.className = 'bead top-bead';
      topBead.dataset.rod = r;
      topBead.dataset.type = 'top';
      topBead.innerHTML = '<div class="bead-shape"></div>';
      topBead.style.top = '0px';
      rod.appendChild(topBead);

      const botBeads = [];
      for (let b = 0; b < 4; b++) {
        const botBead = document.createElement('div');
        botBead.className = 'bead bot-bead';
        botBead.dataset.rod = r;
        botBead.dataset.type = 'bot';
        botBead.dataset.index = b;
        botBead.innerHTML = '<div class="bead-shape"></div>';
        botBead.style.top = `${190 + b * 55}px`;
        rod.appendChild(botBead);
        botBeads.push(botBead);
      }

      this.beadElements.push({ top: topBead, bot: botBeads });

      rod.addEventListener('pointerdown', (e) => this.handlePointerDown(e, r));
      this.container.appendChild(rod);
    }

    this.updateDigitLabels();
    this.updateBeadPositions(false);
  }

  handlePointerDown(e, rodIndex) {
    if (!this.isInteractive || this.isLocked) return;
    getAudioContext();
    const target = e.target.closest('.bead');
    if (!target) return;

    const type = target.dataset.type;
    if (type === 'top') {
      this.state[rodIndex].top = this.state[rodIndex].top === 1 ? 0 : 1;
      playBeadSound();
    } else if (type === 'bot') {
      const idx = parseInt(target.dataset.index, 10);
      const currentBot = this.state[rodIndex].bot;
      if (idx < currentBot) {
        this.state[rodIndex].bot = idx;
      } else {
        this.state[rodIndex].bot = idx + 1;
      }
      playBeadSound();
    }

    this.updateBeadPositions(true);
  }

  updateBeadPositions(animate = true) {
    if (!this.container) return;
    for (let r = 0; r < this.numRods; r++) {
      const st = this.state[r];
      const beads = this.beadElements[r];

      if (st.top === 1) {
        beads.top.style.top = '60px';
        beads.top.classList.add('active');
      } else {
        beads.top.style.top = '0px';
        beads.top.classList.remove('active');
      }

      for (let b = 0; b < 4; b++) {
        const bead = beads.bot[b];
        if (b < st.bot) {
          bead.style.top = `${139 + b * 55}px`;
          bead.classList.add('active');
        } else {
          bead.style.top = `${190 + b * 55}px`;
          bead.classList.remove('active');
        }
      }
    }
  }

  updateDigitLabels() {
    if (!this.container) return;
    const labels = ["万", "千", "百", "十", "一", "1/10", "1/100", "1/1000"];

    for (let r = 0; r < this.numRods; r++) {
      const label = this.labelElements[r];
      const text = labels[r];

      if (text.includes('/')) {
        const [num, den] = text.split('/');
        label.innerHTML = `<div class="fraction"><span class="numerator">${num}</span><span class="denominator">${den}</span></div>`;
      } else {
        label.textContent = text;
      }
    }
  }

  toggleLabels() {
    this.showLabels = !this.showLabels;
    for (let r = 0; r < this.numRods; r++) {
      this.labelElements[r].style.display = this.showLabels ? 'flex' : 'none';
    }
    return this.showLabels;
  }

  setLock(locked) {
    this.isLocked = locked;
  }

  reset() {
    for (let r = 0; r < this.numRods; r++) {
      this.state[r].top = 0;
      this.state[r].bot = 0;
    }
    this.updateBeadPositions(true);
  }

  getValue() {
    let val = 0;
    const basePow = [10000, 1000, 100, 10, 1, 0.1, 0.01, 0.001];
    for (let r = 0; r < this.numRods; r++) {
      const rodVal = this.state[r].top * 5 + this.state[r].bot;
      val += rodVal * basePow[r];
    }
    return Math.round(val * 1000) / 1000;
  }

  setValue(num) {
    this.reset();
    let remaining = Math.round(Math.abs(num) * 1000);
    const factors = [10000000, 1000000, 100000, 10000, 1000, 100, 10, 1];

    for (let r = 0; r < this.numRods; r++) {
      const digit = Math.floor(remaining / factors[r]) % 10;
      if (digit >= 5) {
        this.state[r].top = 1;
        this.state[r].bot = digit - 5;
      } else {
        this.state[r].top = 0;
        this.state[r].bot = digit;
      }
    }
    this.updateBeadPositions(true);
  }
}

// P5：直近10問の履歴
let p5RecentProblems = [];

function generateP5RandomProblem() {
  // 0を含む問題と、0を含まない問題を分けて用意
  let zeroProblems;
  let normalProblems;

  if (globalGrade === 3) {
    // 空位（0）を含む問題
    zeroProblems = [
      305, 1080, 5006, 720, 9034, 150, 608
    ];

    // 空位（0）を含まない問題
    normalProblems = [
      24, 36, 47, 58, 63, 75, 86, 92,
      123, 245, 356, 471, 582, 693, 714, 825,
      1345, 2467, 3578, 4689,
      1234, 2345, 3456, 4567,
      5678, 6789, 7891, 8912
    ];
  } else {
    // 空位（0）を含む問題
    zeroProblems = [
      0.4, 102.3, 0.85, 20.15
    ];

    // 空位（0）を含まない問題
    normalProblems = [
      2.5, 3.6, 4.7, 5.8, 6.9,
      12.3, 14.5, 16.7, 23.4, 25.6,
      31.4, 34.7, 42.5, 46.8, 52.3,
      56.7, 63.4, 67.8, 71.5, 74.2,
      81.6, 85.3, 92.4, 96.7
    ];
  }

  // 直近10問に出ていない問題だけを候補にする
  function getAvailableProblems(list) {
    return list.filter(problem => !p5RecentProblems.includes(problem));
  }

  // 約10%の確率で「空位（0）のある問題」
  const useZeroProblem = Math.random() < 0.1;

  let candidates;

  if (useZeroProblem) {
    candidates = getAvailableProblems(zeroProblems);

    // 直近10問に全部出ていた場合は、通常問題から選ぶ
    if (candidates.length === 0) {
      candidates = getAvailableProblems(normalProblems);
    }
  } else {
    candidates = getAvailableProblems(normalProblems);

    // 通常問題が全部直近10問に入っている場合は、空位問題から選ぶ
    if (candidates.length === 0) {
      candidates = getAvailableProblems(zeroProblems);
    }
  }

  // 万一候補がなくなった場合
  // （問題数が直近10問より少ない場合など）
  if (candidates.length === 0) {
    candidates = [...normalProblems, ...zeroProblems];
  }

  // 候補からランダムに1問選ぶ
  const problem = candidates[Math.floor(Math.random() * candidates.length)];

  // 履歴に追加
  p5RecentProblems.push(problem);

  // 直近10問だけ残す
  if (p5RecentProblems.length > 10) {
    p5RecentProblems.shift();
  }

  return problem;
}

function isNoComplement3rd(n1, n2, isSub) {
  const digits1 = [Math.floor(n1 / 10), n1 % 10];
  const digits2 = [Math.floor(n2 / 10), n2 % 10];

  for (let i = 0; i < 2; i++) {
    const d1 = digits1[i];
    const d2 = digits2[i];

    const top1 = Math.floor(d1 / 5);
    const bot1 = d1 % 5;
    const top2 = Math.floor(d2 / 5);
    const bot2 = d2 % 5;

    if (isSub) {
      if (top1 < top2 || bot1 < bot2) return false;
    } else {
      if (top1 + top2 > 1 || bot1 + bot2 >= 5) return false;
    }
  }
  return true;
}

function generateP6RandomProblem() {
  let op = p6Mode;

  if (globalGrade === 3) {
    let attempts = 0;
    while (attempts < 1000) {
      const n1 = Math.floor(Math.random() * 80) + 10;
      const n2 = Math.floor(Math.random() * 80) + 10;
      if (op === 'sub') {
        if (n1 > n2 && isNoComplement3rd(n1, n2, true)) {
          return { n1, n2, op: '-' };
        }
      } else {
        if (isNoComplement3rd(n1, n2, false)) {
          return { n1, n2, op: '+' };
        }
      }
      attempts++;
    }
    return op === 'sub' ? { n1: 48, n2: 36, op: '-' } : { n1: 63, n2: 25, op: '+' };
  } else {
    let n1 = Math.round((Math.random() * 5 + 3) * 100) / 100;
    let n2 = Math.round((Math.random() * 2 + 1) * 100) / 100;
    if (op === 'sub') {
      if (n1 <= n2) {
        n1 = Math.round((n2 + Math.random() * 3 + 0.5) * 100) / 100;
      }
      return { n1, n2, op: '-' };
    } else {
      return { n1, n2, op: '+' };
    }
  }
}

let p7CurrentAddNum = 1;

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function animateAddDigit(board, rodIndex, addVal) {
  if (addVal <= 0 || rodIndex < 0 || rodIndex >= board.numRods) return;
  
  let st = board.state[rodIndex];
  if (!st) return;
  let current = st.top * 5 + st.bot;
  
  if (current + addVal < 10) {
    if (st.top === 0 && st.bot + addVal < 5) {
      st.bot += addVal;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    } else if (st.top === 0 && addVal === 5) {
      st.top = 1;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    } else if (st.top === 0 && addVal > 5) {
      st.top = 1;
      st.bot += (addVal - 5);
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    } else if (st.top === 0 && addVal < 5 && st.bot + addVal >= 5) {
      st.top = 1;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
      
      st.bot -= (5 - addVal);
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    } else {
      st.bot += addVal;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    }
  } else {
    let comp = 10 - addVal;
    if (st.top === 1 && st.bot < comp) {
      if (comp >= 5) {
        let removeBot = comp - 5;
        if (removeBot > 0) {
          st.bot -= removeBot;
          board.updateBeadPositions(true);
          playBeadSound();
          await sleep(demoSpeedBase);
        }
      } else {
        let addOneBeads = 5 - comp;
        if (addOneBeads > 0) {
          st.bot += addOneBeads;
          board.updateBeadPositions(true);
          playBeadSound();
          await sleep(demoSpeedBase);
        }
      }

      st.top = 0;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);

      await animateAddDigit(board, rodIndex - 1, 1);
    } else {
      st.bot -= comp;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
      await animateAddDigit(board, rodIndex - 1, 1);
    }
  }
}

async function animateSubDigit(board, rodIndex, subVal) {
  if (subVal <= 0 || rodIndex < 0 || rodIndex >= board.numRods) return;
  
  let st = board.state[rodIndex];
  if (!st) return;
  let current = st.top * 5 + st.bot;
  
  if (current >= subVal) {
    if (st.bot >= subVal) {
      st.bot -= subVal;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    } else if (st.top === 1 && subVal === 5) {
      st.top = 0;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    } else if (st.top === 1 && subVal > 5 && st.bot >= subVal - 5) {
      st.bot -= (subVal - 5);
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);

      st.top = 0;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    } else if (st.top === 1 && subVal < 5 && st.bot < subVal) {
      st.bot += (5 - subVal);
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);

      st.top = 0;
      board.updateBeadPositions(true);
      playBeadSound();
      await sleep(demoSpeedBase);
    }
  } else {

async function animateNumberOp(board, val, op) {
  let remaining = Math.round(Math.abs(val) * 1000);
  let factors = [10000000, 1000000, 100000, 10000, 1000, 100, 10, 1];

  for (let r = 0; r < board.numRods; r++) {
    let digit = Math.floor(remaining / factors[r]) % 10;
    if (digit > 0) {
      if (op === '+' || op === 'add') {
        await animateAddDigit(board, r, digit);
      } else {
        await animateSubDigit(board, r, digit);
      }
    }
  }
}

function showJudge(isCorrect) {
  const overlay = document.getElementById('judge-overlay');
  const symbol = document.getElementById('judge-symbol');
  if (!overlay || !symbol) return;

  symbol.textContent = isCorrect ? '⭕' : '❌';
  symbol.style.color = isCorrect ? '#38a169' : '#e53e3e';
  overlay.style.display = 'flex';

  setTimeout(() => {
    overlay.style.display = 'none';
  }, 800);
}

function showClearModal() {
  playFanfareSound();
  const modal = document.getElementById('clear-modal');
  if (modal) modal.classList.add('active');
}

function closeClearModal() {
  const modal = document.getElementById('clear-modal');
  if (modal) modal.classList.remove('active');

  if (currentPage === 4) {
    p4Stage++;
    p4Step = 1;
    p4NextQuestion();
  } else if (currentPage === 5) {
    p5Stage++;
    p5Step = 1;
    p5NextQuestion();
  } else if (currentPage === 6) {
    p6Stage++;
    p6Step = 1;
    p6NextQuestion();
  } else if (currentPage === 7) {
    initP7Problem();
  }
}
